name: assampedia
description: "ASSAMPEDIA: Assam knowledge and government job information app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  http: ^1.6.0
  image_picker: ^1.2.4
  in_app_purchase: ^3.3.1
  path_provider: ^2.1.6
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  timezone: ^0.10.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-400.ttf
        - asset: assets/fonts/NotoSans-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-700.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-400.ttf
        - asset: assets/fonts/NotoSansBengali-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-700.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#175418"
  adaptive_icon_foreground: assets/brand/icon_fg.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#FBF6EA"
  image: assets/brand/splash.png
  color_dark: "#0F1D16"
  image_dark: assets/brand/splash.png
  android_12:
    color: "#FBF6EA"
    image: assets/brand/splash.png
    color_dark: "#0F1D16"
    image_dark: assets/brand/splash.png
  web: false
