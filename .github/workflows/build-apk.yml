name: Build test app (APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assampedia-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish test APK for easy phone download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk assampedia-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build assampedia-test.apk \
            --prerelease \
            --title "ASSAMPEDIA test build" \
            --notes "Latest test build from main (${GITHUB_SHA::7}). Not for the Play Store."
